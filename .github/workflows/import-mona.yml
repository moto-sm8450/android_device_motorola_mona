name: Import existing mona LineageOS work
on:
  push:
    branches: [lineage-23.2]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Preserve original history and remove one-time importer
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --quiet "https://github.com/$GH_REPO.git" source
          cd source
          git config user.name sammyz
          git config user.email 2353166+sammyz@users.noreply.github.com
          git fetch https://github.com/sammyz/android_device_motorola_mona.git lineage-23.2
          test "$(git rev-parse FETCH_HEAD)" = 50ba47798f0dee208a0f4c2646743fd7a98f90fa
          git merge --no-ff --no-commit FETCH_HEAD
          git rm .github/workflows/import-mona.yml
          git commit -m "Import mona LineageOS bring-up with original agy history" -m "Preserve original implementation commits and upstream credits. OpenAI Codex was used to prepare upstream contribution at sammyz's request. Remove this one-time importer; maintain only lineage-23.2."
          git push origin HEAD:lineage-23.2
